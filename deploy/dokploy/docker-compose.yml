# TierGate on Dokploy. Paste this into a Docker Compose service, then set
# BETTER_AUTH_SECRET, MANIFEST_ENCRYPTION_KEY, POSTGRES_PASSWORD and
# BETTER_AUTH_URL in the Environment tab. Add the domain in the Domains tab
# (service: tiergate, port: 2099). Dokploy's Traefik handles HTTPS.
services:
  tiergate:
    image: ghcr.io/faisalahammad/tiergate:${MANIFEST_VERSION:-latest}
    restart: unless-stopped
    expose:
      - "2099"
    environment:
      - PORT=2099
      - BIND_ADDRESS=0.0.0.0
      - DATABASE_URL=postgresql://manifest:${POSTGRES_PASSWORD}@postgres:5432/manifest
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - MANIFEST_ENCRYPTION_KEY=${MANIFEST_ENCRYPTION_KEY}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - MANIFEST_MODE=selfhosted
      - NODE_ENV=production
      - MANIFEST_TELEMETRY_DISABLED=1
      - REQUEST_RECORDING_STORAGE=filesystem
      - REQUEST_RECORDING_FILESYSTEM_PATH=/data/request-recordings
    volumes:
      - tiergate-recordings:/data/request-recordings
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:2099/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=manifest
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=manifest
    volumes:
      - tiergate-postgres:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U manifest
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  tiergate-postgres:
  tiergate-recordings:
