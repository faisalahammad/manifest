name: TierGate
description:
  TierGate is an open-source model router for AI agents and apps. Connect
  OpenAI-compatible clients to one endpoint, route requests across your own
  provider API keys, subscriptions, local models, and custom providers, and keep
  usage data in your own infrastructure.
instructions:
  Open the generated domain after deployment and create the first admin account.
  Fresh installs redirect to /setup. Use a real HTTPS domain before configuring
  OAuth callback URLs or production authentication flows. Anonymous telemetry is
  sent only if you set a telemetry endpoint.
changeLog:
  - date: 2026-08-06
    description: Persist compressed request recordings in a dedicated app volume
  - date: 2026-07-08
    description: Initial TierGate template
links:
  - label: Website
    url: https://github.com/faisalahammad/tiergate
  - label: Documentation
    url: https://github.com/faisalahammad/tiergate#readme
  - label: GitHub
    url: https://github.com/faisalahammad/tiergate
  - label: Docker Hub
    url: https://github.com/faisalahammad/tiergate/pkgs/container/tiergate
contributors:
  - name: Guillaume Gay
    url: https://github.com/guillaumegay13
schema:
  type: object
  required:
    - appServiceName
    - appServiceImage
    - databaseServiceName
  properties:
    appServiceName:
      type: string
      title: App Service Name
      default: manifest
    appServiceImage:
      type: string
      title: App Service Image
      default: ghcr.io/faisalahammad/tiergate:6
    databaseServiceName:
      type: string
      title: Database Service Name
      default: manifest-db
    telemetryDisabled:
      type: string
      title: Anonymous Telemetry
      default: "1"
      oneOf:
        - enum:
            - "0"
          title: Enabled (needs TELEMETRY_ENDPOINT)
        - enum:
            - "1"
          title: Disabled (default)
benefits:
  - title: One endpoint for AI agents
    description:
      TierGate exposes an OpenAI-compatible endpoint that AI agents and apps can
      use while you keep control of provider credentials and routing.
  - title: Self-hosted data path
    description:
      Run TierGate and PostgreSQL on your own server through Easypanel instead
      of sending prompts, responses, and usage data through a hosted proxy.
  - title: Bring your own providers
    description:
      Connect API keys, subscriptions, local models, and custom providers from a
      single dashboard.
features:
  - title: OpenAI-compatible API
    description:
      Point compatible clients at TierGate and route requests through your
      configured providers.
  - title: PostgreSQL persistence
    description:
      The template provisions a PostgreSQL service for TierGate data and stores
      provider credentials with a generated encryption key.
  - title: Request recording persistence
    description:
      Compressed request recordings are stored in a dedicated persistent volume
      mounted by the TierGate app service.
  - title: Usage tracking
    description:
      Track routed requests, spend, and provider behavior from the TierGate
      dashboard.
tags:
  - AI
  - Developer Tools
  - Databases
